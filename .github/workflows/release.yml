name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Derivar versão da tag
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $ver"

      - name: Publish GUI (self-contained, folder, win-x64)
        shell: pwsh
        run: |
          dotnet publish source/Memo/Memo.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o publish

      - name: Publish CLI (self-contained, folder, win-x64)
        shell: pwsh
        run: |
          dotnet publish source/Memo.Cli/Memo.Cli.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o publish

      - name: Assinar executável (certificado auto-assinado)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        if: env.PFX_BASE64 != ''
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "memo.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe `
            | Where-Object { $_.FullName -like '*x64*' } `
            | Select-Object -First 1 -ExpandProperty FullName

          & $signtool sign /f $pfxPath /p $env:PFX_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "publish/Memo.exe" "publish/memo-cli.exe"

          Remove-Item $pfxPath -Force

      - name: Empacotar (zip) + manifesto + checksum
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zipName = "Memo-win-x64.zip"

          # Artefato de distribuição: a pasta publicada inteira (exes + DLLs + runtime).
          Compress-Archive -Path publish/* -DestinationPath $zipName -Force

          $zipHash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $zipName" | Out-File -Encoding ascii "$zipName.sha256"

          # Manifesto (URL estável do pacote + hash) consumido pelo auto-update.
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$zipName"
          $manifest = [ordered]@{ version = $ver; url = $url; sha256 = $zipHash }
          $manifest | ConvertTo-Json | Out-File -Encoding utf8 "latest.json"

          Write-Host "ZIP SHA256: $zipHash"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Memo ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            Memo-win-x64.zip
            Memo-win-x64.zip.sha256
            latest.json
